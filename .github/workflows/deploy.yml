# Publishes the game to Cloudflare on every push to main, so publishing never
# depends on the machine the push came from having wrangler, the token, or a
# platform the build runs on.
name: deploy

on:
  push:
    branches: [main]
  # So a failed run can be retried without an empty commit.
  workflow_dispatch:

# One deploy at a time, and never cancel one mid-upload: the tail of the queue
# is the commit that ends up live.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The gate: a red suite never reaches the edge. `npm run build` is tsc
      # plus vite, so the types are checked here too.
      - run: npm test
      - run: npm run build

      # wrangler comes from the lockfile, so CI publishes with the same version
      # a local `npm run deploy` would. The account is pinned in wrangler.jsonc;
      # the token is the only credential.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
